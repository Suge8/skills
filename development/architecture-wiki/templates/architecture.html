<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="wiki-digest" content="__WIKI_DIGEST__">
<title>__TITLE__</title>
<style>
  :root {
    --bg: #F2EFE6;
    --surface: #E7E3D5;
    --card: #FBFAF4;
    --ink: #20261F;
    --ink-soft: #71766B;
    --line: rgba(32, 38, 31, .1);
    --accent: #3E7A5E;
    --accent-deep: #2C5E47;
    --warn: #BE5560;
    --navw: clamp(195px, 15vw, 235px);
    --asidew: clamp(295px, 24vw, 355px);
    --paper: var(--card);
    --paper-hi: var(--card);
    --mono: ui-monospace, "SF Mono", Menlo, "PingFang SC", monospace;
    --sans: -apple-system, "PingFang SC", "Segoe UI", sans-serif;
    --serif: "Georgia", "Songti SC", serif;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--ink);
    font: 12.5px/1.65 var(--sans);
    display: flex; flex-direction: column; overflow: hidden;
  }
  .ic { width: 13px; height: 13px; flex-shrink: 0; vertical-align: -2px; }
  header { display: flex; align-items: center; gap: 10px; padding: 12px 16px 4px; }
  .brand { display: flex; align-items: center; gap: 10px; margin-right: 6px; }
  .brand img, .brand svg.logo { width: 28px; height: 28px; }
  .brand .k { display: none; }
  .brand .v { font: 700 15px var(--serif); white-space: nowrap; }
  .statbar {
    display: flex; align-items: center; gap: 12px;
    background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 7px 14px;
  }
  .statbar .stat { display: flex; align-items: center; gap: 6px; }
  .statbar .stat .ic { width: 12px; height: 12px; color: var(--accent-deep); }
  .statbar .k { font-size: 11px; color: var(--ink-soft); }
  .statbar .v { font: 700 12.5px var(--mono); white-space: nowrap; }
  .statbar .sep { width: 1px; height: 14px; background: var(--line); }
  header .spacer { flex: 1; }
  header button {
    display: flex; align-items: center; gap: 6px;
    font: 600 12px var(--sans); cursor: pointer; border-radius: 10px;
    background: var(--card); color: var(--ink); border: 1px solid var(--line); padding: 7px 14px;
    transition: background .15s, color .15s;
  }
  header button.primary { background: var(--accent); color: #FFF; border-color: transparent; }
  header button.primary:hover { background: var(--accent-deep); }
  header button:not(.primary):hover { background: var(--surface); }
  header button.vitals-btn {
    border-color: color-mix(in srgb, var(--warn) 32%, transparent); color: var(--warn);
  }
  header button.vitals-btn:hover { background: color-mix(in srgb, var(--warn) 8%, transparent); }
  header button.vitals-btn .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--warn); }
  dialog#healthDlg {
    border: none; padding: 0; background: none; overflow: visible;
    width: 100%; height: 100%; max-width: 100%; max-height: 100%;
  }
  dialog#healthDlg[open] { display: flex; align-items: center; justify-content: center; }
  dialog#healthDlg::backdrop { background: rgba(32, 38, 31, .4); }
  .hmodal {
    width: min(720px, 92vw); max-height: 84vh; overflow-y: auto;
    background: var(--card); border: 1px solid var(--line); border-radius: 18px;
    padding: 18px 24px 26px; box-shadow: 0 20px 60px rgba(20, 20, 19, .24);
  }
  .hmodal .hclose {
    position: sticky; top: 0; float: right; margin: -4px -8px 0 0;
    width: 28px; height: 28px; border-radius: 9px; display: flex; align-items: center; justify-content: center;
    background: var(--card); border: 1px solid var(--line); color: var(--ink-soft); cursor: pointer;
  }
  .hmodal .hclose:hover { background: var(--surface); color: var(--ink); }
  dialog#healthDlg[open] .hmodal { animation: hin .2s cubic-bezier(.16, 1, .3, 1); }
  @keyframes hin { from { opacity: 0; transform: translateY(8px) scale(.985); } }
  main { flex: 1; display: flex; min-height: 0; gap: 10px; padding: 10px 12px 12px; position: relative; }
  .handle {
    position: absolute; z-index: 30; top: 50%; transform: translateY(-50%);
    width: 26px; height: 46px; border-radius: 13px; padding: 0;
    display: flex; align-items: center; justify-content: center;
    background: var(--card); border: 1px solid var(--line); cursor: pointer;
    color: var(--ink-soft); box-shadow: 0 1px 4px rgba(20, 20, 19, .08);
    transition: left .24s cubic-bezier(.2, 0, 0, 1), right .24s cubic-bezier(.2, 0, 0, 1), background .15s, color .15s;
  }
  .handle:hover { background: var(--surface); color: var(--accent-deep); }
  .handle .ic { width: 12px; height: 12px; transition: transform .2s; }
  #handleNav { left: calc(12px + var(--navw) - 13px); }
  body.nav-off #handleNav { left: 6px; }
  body.nav-off #handleNav .ic { transform: rotate(180deg); }
  #handleAside { right: calc(12px + var(--asidew) - 13px); }
  #handleAside .ic { transform: rotate(180deg); }
  body.aside-off #handleAside { right: 6px; }
  body.aside-off #handleAside .ic { transform: rotate(0deg); }
  nav, #stage, aside {
    background: var(--card); border: 1px solid var(--line); border-radius: 16px;
  }
  nav {
    width: var(--navw);
    overflow-y: auto; padding: 8px 8px 20px; flex-shrink: 0;
  }
  nav, aside { transition: margin .24s cubic-bezier(.2, 0, 0, 1), opacity .18s ease-out; }
  body.nav-off nav { margin-left: calc(-1 * var(--navw) - 10px); opacity: 0; pointer-events: none; }
  body.aside-off aside { margin-right: calc(-1 * var(--asidew) - 10px); opacity: 0; pointer-events: none; }
  nav .filter { position: sticky; top: 0; background: var(--card); padding: 2px 2px 8px; z-index: 2; }
  nav .filter input {
    width: 100%; font: 12px var(--sans); padding: 6px 10px; border-radius: 9px;
    border: 1px solid var(--line); background: var(--bg); color: var(--ink); outline: none;
  }
  nav .filter input:focus { border-color: var(--accent); }
  nav .grp {
    display: flex; align-items: center; gap: 7px;
    font: 700 10.5px var(--mono); letter-spacing: .1em;
    margin: 12px 4px 4px; padding: 6px 10px; border-radius: 8px; cursor: pointer;
  }
  nav .grp .ct { margin-left: auto; font-weight: 400; letter-spacing: 0; }
  nav .grp .chev { transition: transform .15s; font-size: 9px; }
  nav .grp.closed .chev { transform: rotate(-90deg); }
  nav .grpbody.closed { display: none; }
  nav .item {
    display: flex; gap: 8px; align-items: center; padding: 5.5px 9px; margin: 2px 0;
    cursor: pointer; border-radius: 8px; line-height: 1.4;
  }
  nav .item:hover { background: var(--surface); }
  nav .item.sel { background: color-mix(in srgb, var(--accent) 13%, transparent); color: var(--accent-deep); }
  nav .item.hid { display: none; }
  nav .item.dm { opacity: .35; }
  nav .code {
    font: 700 10.5px var(--mono); border: 1px solid var(--line); border-radius: 5px;
    padding: 0 4px; min-width: 26px; text-align: center; background: var(--bg); flex-shrink: 0;
  }
  nav .nm { font-size: 12.5px; }
  nav .ct { margin-left: auto; font-size: 11px; color: var(--ink-soft); }
  nav .hdot { width: 6px; height: 6px; border-radius: 50%; background: var(--warn); flex-shrink: 0; }
  #stage { flex: 1; position: relative; min-width: 0; cursor: grab; overflow: hidden; touch-action: none; }
  #stage.panning { cursor: grabbing; }
  #stage svg { width: 100%; height: 100%; display: block; }
  #flowbar {
    position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 3px; background: var(--card); border: 1px solid var(--line);
    border-radius: 12px; padding: 3px; z-index: 5; max-width: 86%; overflow-x: auto;
    box-shadow: 0 2px 10px rgba(20, 20, 19, .06);
  }
  #flowbar button {
    font: 600 11.5px var(--sans); border: 1px solid transparent; background: none;
    color: var(--ink-soft); padding: 5px 12px; border-radius: 9px; cursor: pointer; white-space: nowrap;
  }
  #flowbar button.on { background: var(--accent); color: #FFF; }
  aside {
    width: var(--asidew);
    display: flex; flex-direction: column; flex-shrink: 0;
  }
  .tabs { display: flex; gap: 4px; margin: 10px 12px 0; background: var(--surface); border-radius: 11px; padding: 3px; }
  .tabs button {
    flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px;
    font: 600 12.5px var(--sans); padding: 7px 0; border-radius: 8px;
    background: none; color: var(--ink-soft); border: 1px solid transparent; cursor: pointer;
  }
  .tabs button.on { background: var(--card); color: var(--ink); border: 1px solid var(--line); }
  #panel { flex: 1; overflow-y: auto; padding: 16px 20px 30px; }
  #panel .kicker {
    display: flex; align-items: center; gap: 7px;
    font-size: 10.5px; letter-spacing: .15em; color: var(--ink-soft);
  }
  #panel h2, .hmodal h2 { font: 700 18px/1.4 var(--serif); margin: 6px 0 12px; }
  #panel .titlerow { display: flex; align-items: baseline; gap: 10px; justify-content: space-between; }
  #panel .titlerow h2 { margin-bottom: 10px; }
  #panel .titlerow .chips { margin: 0; flex-shrink: 0; }
  #panel h3 { font-size: 11px; letter-spacing: .13em; color: var(--ink-soft); margin: 18px 0 7px; }
  #panel p { font: 13.5px/1.75 var(--sans); margin-bottom: 11px; }
  #panel mark { background: color-mix(in srgb, var(--accent) 18%, transparent); color: var(--accent-deep); padding: 0 4px; border-radius: 4px; font-weight: 700; }
  #panel ul { list-style: none; padding: 0; }
  #panel li { font-size: 12px; margin: 4px 0; }
  #panel li.src { display: flex; align-items: baseline; gap: 6px; }
  #panel li.src code, #panel .src code { word-break: break-all; }
  #panel code { font: 11.5px var(--mono); background: var(--surface); border: 1px solid var(--line); padding: 1px 6px; border-radius: 6px; }
  #panel .src { cursor: pointer; }
  #panel .src:hover code { border-color: var(--accent); color: var(--accent-deep); }
  #panel .steps li { cursor: pointer; padding: 3px 0; font-size: 12.5px; }
  #panel .steps li:hover { color: var(--accent-deep); }
  #panel .steps li.done { color: var(--ink-soft); }
  #panel .steps li.now { color: var(--accent-deep); font-weight: 700; }
  #panel .chips { display: flex; flex-wrap: wrap; gap: 5px; margin: 4px 0 6px; }
  #panel .chip {
    font: 600 11px var(--sans); background: var(--surface); border: 1px solid var(--line);
    border-radius: 8px; padding: 3px 9px; cursor: pointer;
  }
  #panel .chip:hover { border-color: var(--accent); color: var(--accent-deep); }
  #panel .chip.hchip {
    background: color-mix(in srgb, var(--warn) 7%, transparent);
    border-color: color-mix(in srgb, var(--warn) 28%, transparent); color: var(--warn);
  }
  #panel .chip.hchip:hover { border-color: var(--warn); background: color-mix(in srgb, var(--warn) 12%, transparent); }
  #panel .dimtext { color: var(--ink-soft); font-size: 12px; }
  #panel .md-body h1 { font: 700 15px/1.5 var(--serif); margin: 16px 0 8px; }
  #panel .md-body h2 { font: 700 13px/1.5 var(--sans); letter-spacing: .01em; margin: 20px 0 8px; }
  #panel .md-body h3, #panel .md-body h4 { font: 700 12px var(--sans); letter-spacing: 0; color: var(--ink); margin: 12px 0 6px; }
  #panel .md-body pre { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; overflow-x: auto; margin: 0 0 11px; }
  #panel .md-body pre code { border: none; background: none; padding: 0; font-size: 11px; line-height: 1.6; display: block; }
  #panel .md-body ul { list-style: disc; padding-left: 18px; margin-bottom: 11px; }
  #panel .md-body ol { padding-left: 18px; margin-bottom: 11px; }
  #panel .md-body li { font: 12.5px/1.7 var(--sans); margin: 3px 0; }
  #panel .md-body table { border-collapse: collapse; margin: 0 0 12px; width: 100%; }
  #panel .md-body th, #panel .md-body td { border: 1px solid var(--line); padding: 4px 8px; font-size: 11.5px; text-align: left; }
  #panel .md-body th { background: var(--surface); font-size: 10.5px; letter-spacing: .05em; color: var(--ink-soft); }
  #panel .md-body tbody tr:nth-child(even) td { background: color-mix(in srgb, var(--surface) 55%, transparent); }
  #panel .md-body li::marker { color: var(--accent); }
  .vitals {
    display: flex; gap: 14px; align-items: center; margin: 2px 0 16px;
    background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px;
  }
  .gauge { position: relative; width: 84px; height: 84px; flex-shrink: 0; }
  .gauge svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .gauge circle { fill: none; stroke-width: 8; }
  .gauge .gbg { stroke: color-mix(in srgb, currentColor 16%, transparent); }
  .gauge .gfg { stroke: currentColor; stroke-linecap: round; transition: stroke-dashoffset .7s cubic-bezier(.16, 1, .3, 1); }
  .gscore { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font: 700 22px var(--mono); color: var(--ink); }
  .gscore span { font-size: 10px; color: var(--ink-soft); margin: 9px 0 0 1px; }
  .vmeta { flex: 1; min-width: 0; }
  .vgrade { font: 700 15px var(--sans); }
  .vadvice { margin: 2px 0 9px; }
  .vadvice div { font-size: 11px; line-height: 1.6; color: var(--ink-soft); }
  .vadvice b { font-weight: 700; }
  .vstats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .vstat { background: var(--card); border: 1px solid var(--line); border-radius: 9px; padding: 5px 3px; text-align: center; cursor: pointer; transition: border-color .15s; }
  .vstat:hover { border-color: var(--accent); }
  .vstat .vv { font: 700 14px var(--mono); color: var(--ink-soft); }
  .vstat .vv em { font: 600 9.5px var(--sans); font-style: normal; opacity: .85; }
  .vstat .vk { font-size: 10px; color: var(--ink-soft); margin-top: 1px; }
  .hmodal .md-body { font: 12.5px/1.75 var(--sans); }
  .hmodal .md-body h2 { font: 700 13px/1.5 var(--sans); margin: 20px 0 8px; }
  .hmodal .md-body h3 { font: 700 12px var(--sans); margin: 14px 0 6px; }
  .hmodal .md-body p, .hmodal .md-body li { font-size: 12.5px; }
  .hmodal .md-body ul { list-style: disc; padding-left: 18px; margin-bottom: 11px; }
  .hmodal .md-body li { margin: 3px 0; }
  .hmodal .md-body li::marker { color: var(--accent); }
  .hmodal .md-body code { font: 11.5px var(--mono); background: var(--surface); border: 1px solid var(--line); padding: 1px 6px; border-radius: 6px; }
  .hmodal .md-body table { border-collapse: collapse; width: 100%; margin: 0 0 12px; }
  .hmodal .md-body th, .hmodal .md-body td { border: 1px solid var(--line); padding: 5px 9px; font-size: 11.5px; text-align: left; }
  .hmodal .md-body th { background: var(--surface); font-size: 10.5px; letter-spacing: .05em; color: var(--ink-soft); }
  .hmodal .md-body tbody tr:nth-child(even) td { background: color-mix(in srgb, var(--surface) 55%, transparent); }
  .dt { transition: opacity .18s; }
  .dt.dim { opacity: .13; }
  @media (prefers-reduced-motion: reduce) {
    .gauge .gfg { transition: none; }
    dialog#healthDlg[open] .hmodal { animation: none; }
  }
  #panel .md-body blockquote { border-left: 3px solid var(--accent); padding: 2px 10px; color: var(--ink-soft); margin: 0 0 11px; }
  #panel .md-body a { color: var(--accent-deep); }
  #panel .md-body hr { border: none; border-top: 1px solid var(--line); margin: 12px 0; }
  #panel .wl { cursor: pointer; text-decoration: underline dotted; }
  .b, .lk { transition: opacity .18s, transform .2s ease; cursor: pointer; }
  .hbadge { cursor: pointer; }
  .hbadge .ring { transition: r .15s ease-out; }
  .hbadge:hover .ring { r: 8.5; }
  .b.dim, .lk.dim { opacity: .13; }
  #svg g.b:not([data-plate]):hover { transform: translateY(-3px); }
  #svg g.b.hop { animation: hop .5s ease; }
  @keyframes hop { 30% { transform: translateY(-7px); } 60% { transform: translateY(-1px); } }
  #selring { animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .3; } }
  @media (prefers-reduced-motion: reduce) {
    #selring, #svg g.b.hop { animation: none; }
    #svg g.b:not([data-plate]):hover { transform: none; }
    nav, aside, .handle { transition: none; }
  }
  /* 窄屏：两栏转为固定抽屉，把手停靠屏幕边缘 */
  @media (max-width: 1080px) {
    nav {
      position: fixed; left: 0; top: 0; bottom: 0; z-index: 20; margin: 0;
      width: min(78vw, 320px); border-radius: 0 16px 16px 0;
      box-shadow: 10px 0 34px rgba(20, 20, 19, .18);
      transition: transform .26s cubic-bezier(.2, 0, 0, 1);
    }
    body.nav-off nav { margin: 0; opacity: 1; transform: translateX(calc(-100% - 40px)); }
    #handleNav { position: fixed; left: calc(min(78vw, 320px) - 13px); }
    body.nav-off #handleNav { left: 6px; }
  }
  @media (max-width: 820px) {
    aside {
      position: fixed; right: 0; top: 0; bottom: 0; z-index: 20; margin: 0;
      width: min(88vw, 360px); border-radius: 16px 0 0 16px;
      box-shadow: -10px 0 34px rgba(20, 20, 19, .18);
      transition: transform .26s cubic-bezier(.2, 0, 0, 1);
    }
    body.aside-off aside { margin: 0; opacity: 1; transform: translateX(calc(100% + 40px)); }
    #handleAside { position: fixed; right: calc(min(88vw, 360px) - 13px); }
    body.aside-off #handleAside { right: 6px; }
  }
  @media (max-width: 700px) {
    .statbar { display: none; }
    header { gap: 6px; }
    header button.compact .lb { display: none; }
    header button.compact { padding: 7px 9px; }
    .vstats { grid-template-columns: repeat(2, 1fr); }
    .hmodal { padding: 16px 16px 22px; }
  }
</style>
</head>

<script>
const DATA = __ARCH_DATA__;
const FLOWS = DATA.flows || [];
const WIKI = DATA.wiki || {};

const ic = (name, s = 13) => `<svg class="ic" style="width:${s}px;height:${s}px"><use href="#ic-${name}"/></svg>`;

/* ── 分区色（Anthropic 风暖调低饱和）── */
const TINTS = ["#3E7A5E", "#C9704A", "#557FA8", "#9A6FB4", "#B08F4C", "#BE5560"];

DATA.districts.forEach((d, i) => tintOf[d.id] = d.tint || TINTS[i % TINTS.length]);
const mix = (c, pct, base) => `color-mix(in srgb, ${c} ${pct}%, ${base})`;

/* ── header ── */
const STAT_ICONS = [["语言", "globe"], ["行数", "file"], ["文件", "folder"], ["模块", "cube"], ["入口", "gateway"], ["场景", "play"], ["外部", "plug"], ["依赖", "plug"], ["页", "book"], ["服务", "server"], ["测试", "shield"]];
const statIcon = k => (STAT_ICONS.find(([p]) => k.includes(p)) || [0, "sparkle"])[1];
document.getElementById("hdr").innerHTML =
  `<div class="brand">${DATA.meta.logo || ""}<div class="v">${DATA.meta.title}</div></div>` +
  `<div class="statbar">` + DATA.meta.stats.map(([k, v, tip]) =>
    `<div class="stat"${tip ? ` title="${tip}"` : ""}>${ic(statIcon(k), 12)}<span class="k">${k}</span><span class="v">${v}</span></div>`
  ).join(`<span class="sep"></span>`) + `</div>` +
  `<div class="spacer"></div>
   <button id="btnPlay" class="primary">${ic("play")}<span class="lb">播放场景</span></button>
   <button id="btnStep" class="compact" title="单步">${ic("stepfwd")}<span class="lb">单步</span></button>
   <button id="btnReset" class="compact" title="重置取景">${ic("reset")}<span class="lb">重置</span></button>` +
  (WIKI["health.md"] ? `<button id="btnHealth" class="vitals-btn compact" title="体检报告">${ic("shield")}<span class="lb">体检报告</span><span class="dot"></span></button>` : "");
/* 把手：骑在两张卡片内边缘，收起后停靠屏幕边缘；窄屏默认收起 */
if (matchMedia("(max-width: 1080px)").matches) document.body.classList.add("nav-off");
if (matchMedia("(max-width: 820px)").matches) document.body.classList.add("aside-off");
const bindCollapse = (id, cls, name) => {
  const b = document.getElementById(id);
  const sync = () => {
    const off = document.body.classList.contains(cls);
    b.setAttribute("aria-expanded", String(!off));

  };
  b.onclick = () => { document.body.classList.toggle(cls); sync(); };
  sync();
};
bindCollapse("handleNav", "nav-off", "导航栏");
bindCollapse("handleAside", "aside-off", "面板");

/* ── 数据索引 ── */
const N = {}; DATA.nodes.forEach(n => { n.w ??= 1.1; n.d ??= 1.1; N[n.code] = n; });
const HEALTH_SECTIONS = { dead: "死代码", cycles: "循环依赖", hotspot: "高危热点", breaks: "断点" };
const healthTip = n => "体检：" + n.health.map(h => HEALTH_SECTIONS[h] || h).join("、");
const DIST = {}; DATA.districts.forEach(d => DIST[d.id] = d);
const adj = {};
const addAdj = (a, b) => { (adj[a] ??= new Set()).add(b); (adj[b] ??= new Set()).add(a); };
DATA.links.forEach(l => addAdj(l.from, l.to));
FLOWS.forEach(f => f.steps.forEach(s => addAdj(s.from, s.to)));

/* ── 迷你 Markdown 渲染（零依赖，覆盖 wiki 页常用子集）── */
const esc = s => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
function inline(s) {
  s = esc(s);
  s = s.replace(/`([^`]+)`/g, "<code>$1</code>");
  s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, (m, t, u) =>
    /\.md(#|$)/.test(u) && !/^https?:/.test(u)
      ? `<a class="wl" data-href="${u}">${t}</a>`
      : `<a href="${u}" target="_blank" rel="noopener">${t}</a>`);
  return s;
}
function mdRender(text) {
  const body = text.replace(/^---\n[\s\S]*?\n---\n?/, "");
  const lines = body.split("\n"), out = [];
  let i = 0, para = [], h1seen = false;
  const flush = () => { if (para.length) { out.push(`<p>${inline(para.join(" "))}</p>`); para = []; } };
  while (i < lines.length) {
    const L = lines[i];
    if (/^```/.test(L)) {
      flush(); const buf = []; i++;
      while (i < lines.length && !/^```/.test(lines[i])) buf.push(lines[i++]);
      i++; out.push(`<pre><code>${esc(buf.join("\n"))}</code></pre>`); continue;
    }
    const h = L.match(/^(#{1,4})\s+(.*)/);
    if (h) {
      flush();
      if (h[1].length === 1 && !h1seen) { h1seen = true; i++; continue; }  // 首个 H1 与面板页题重复，不重渲染
      out.push(`<h${h[1].length} data-h="${esc(h[2].trim())}">${inline(h[2])}</h${h[1].length}>`); i++; continue;
    }
    if (/^\s*[-*]\s+/.test(L)) {
      flush(); const items = [];
      while (i < lines.length && /^\s*[-*]\s+/.test(lines[i])) items.push(lines[i++].replace(/^\s*[-*]\s+/, ""));
      out.push(`<ul>${items.map(x => `<li>${inline(x)}</li>`).join("")}</ul>`); continue;
    }
    if (/^\s*\d+\.\s+/.test(L)) {
      flush(); const items = [];
      while (i < lines.length && /^\s*\d+\.\s+/.test(lines[i])) items.push(lines[i++].replace(/^\s*\d+\.\s+/, ""));
      out.push(`<ol>${items.map(x => `<li>${inline(x)}</li>`).join("")}</ol>`); continue;
    }
    if (/^\|/.test(L) && /^\s*\|[\s:|-]+\|?\s*$/.test(lines[i + 1] || "")) {
      flush(); const rows = [];
      while (i < lines.length && /^\|/.test(lines[i])) rows.push(lines[i++]);
      const cells = r => r.replace(/^\||\|$/g, "").split("|").map(c => inline(c.trim()));
      out.push(`<table><thead><tr>${cells(rows[0]).map(c => `<th>${c}</th>`).join("")}</tr></thead><tbody>` +
        rows.slice(2).map(r => `<tr>${cells(r).map(c => `<td>${c}</td>`).join("")}</tr>`).join("") + "</tbody></table>");
      continue;
    }
    if (/^>\s?/.test(L)) {
      flush(); const buf = [];
      while (i < lines.length && /^>\s?/.test(lines[i])) buf.push(lines[i++].replace(/^>\s?/, ""));
      out.push(`<blockquote>${inline(buf.join(" "))}</blockquote>`); continue;
    }
    if (/^---+\s*$/.test(L)) { flush(); out.push("<hr>"); i++; continue; }
    if (/^\s*$/.test(L)) { flush(); i++; continue; }
    para.push(L); i++;
  }
  flush();
  return `<div class="md-body">${out.join("")}</div>`;
}
function resolvePage(cur, href) {
  const base = cur.includes("/") ? cur.slice(0, cur.lastIndexOf("/") + 1) : "";
  const stack = [];
  for (const seg of (base + href.split("#")[0]).split("/")) {
    if (seg === "." || seg === "") continue;
    if (seg === "..") stack.pop(); else stack.push(seg);
  }
  return stack.join("/");
}

/* ── 等距投影 ── */
const S = 38, ORX = 500, ORY = 56;
const iso = (x, y, z = 0) => [ORX + (x - y) * S * .866, ORY + (x + y) * S * .5 - z * S];
const P = a => a.map(p => p.map(v => +v.toFixed(1)).join(",")).join(" ");
const svg = document.getElementById("svg");
const NS = "http://www.w3.org/2000/svg";
const el = (t, a, parent) => { const e = document.createElementNS(NS, t);
  for (const k in a) e.setAttribute(k, a[k]); (parent || svg).appendChild(e); return e; };

const defs = el("defs", {});
defs.innerHTML = `
  <marker id="arr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M.5 .8 L8 4 L.5 7.2 L2.6 4 z" fill="var(--ink)"/></marker>
  <marker id="arrA" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M.5 .8 L8 4 L.5 7.2 L2.6 4 z" fill="var(--accent)"/></marker>
  <filter id="soft" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="2.2"/></filter>`;
/* 实色三面 + 同色系深色棱线：体积清晰，无叠加光效 */
const faceColors = did => ({
  top: mix(tintOf[did], 26, "var(--paper-hi)"),
  right: mix(tintOf[did], 50, "var(--paper)"),
  front: mix(tintOf[did], 70, "var(--paper)"),
});
const edgeStyle = (did, dashed) => dashed
  ? { stroke: "var(--ink)", "stroke-opacity": .6, "stroke-width": 1.4, "stroke-dasharray": "3 2.4", "stroke-linejoin": "round" }
  : { stroke: mix(tintOf[did], 58, "var(--ink)"), "stroke-opacity": .7, "stroke-width": 1.5, "stroke-linejoin": "round" };

const world = el("g", { id: "world" });
const gGrid = el("g", {}, world), gDist = el("g", {}, world), gSel = el("g", {}, world),
      gLink = el("g", {}, world), gFlow = el("g", {}, world), gStreak = el("g", {}, world),
      gNode = el("g", {}, world), gPlate = el("g", {}, world), gTag = el("g", {}, world);

const GX = Math.ceil(Math.max(...DATA.districts.map(d => d.r[0] + d.r[2]))) + 2;
const GY = Math.ceil(Math.max(...DATA.districts.map(d => d.r[1] + d.r[3]))) + 2;
for (let i = -1; i <= GX; i++)
  el("polyline", { points: P([iso(i, -1), iso(i, GY)]), stroke: "var(--ink)", "stroke-width": .25, opacity: .1, fill: "none" }, gGrid);
for (let i = -1; i <= GY; i++)
  el("polyline", { points: P([iso(-1, i), iso(GX, i)]), stroke: "var(--ink)", "stroke-width": .25, opacity: .1, fill: "none" }, gGrid);
for (const d of DATA.districts) {

  const page = pageRef.split("#")[0];
  const m = (WIKI[page] || "").replace(/^---\n[\s\S]*?\n---\n?/, "").match(/^#\s+(.+)$/m);
  return m ? m[1] : page.replace(/\.md$/, "");
}
/* 体检评分：公式固化在模板，agent 只提供工具产出的计数（DATA.health）。
   死文件/死导出按每百源文件密度扣分（大小仓库同尺）；循环与断裂按绝对条数扣（应恒为零）；疑似未确认，低权。 */
function vitalsCard() {
  const h = DATA.health;
  if (!h) return "";
  const n = h.files || 100;
  const cuts = [
    [Math.min(25, (h.dead ?? 0) / n * 500), `清理 ${h.dead} 个死文件`],
    [Math.min(15, (h.deadExports ?? 0) / n * 8), `删除 ${h.deadExports} 个未用导出`],
    [Math.min(25, (h.cycles ?? 0) * 6), `拆开 ${h.cycles} 条循环依赖`],
    [Math.min(25, (h.breaks ?? 0) * 8), `修复 ${h.breaks} 处断裂引用`],
    [Math.min(5, (h.suspects ?? 0) * .5), `逐一确认 ${h.suspects} 个疑似死文件`],
  ];
  const score = Math.max(0, Math.round(100 - cuts.reduce((s, [c]) => s + c, 0)));
  const [grade, color] = score >= 90 ? ["健康", "var(--accent)"] : score >= 75 ? ["尚可", "#B08F4C"]
    : score >= 60 ? ["亚健康", "#C9704A"] : ["高危", "var(--warn)"];
  const advice = cuts.filter(([c]) => c >= 1).sort((a, b) => b[0] - a[0]).slice(0, 2)
    .map(([c, t]) => `<div>${t} <b style="color:${color}">≈ +${Math.round(c)} 分</b></div>`)
    .join("") || `<div>零死码零断裂，保持住就是满分状态</div>`;
  const C = (2 * Math.PI * 34).toFixed(1);
  const stat = (label, val, sec, extra = "") =>
    `<div class="vstat" data-hsec="${sec}"><div class="vv"${val ? ` style="color:${color}"` : ""}>${val}${extra}</div><div class="vk">${label}</div></div>`;
  return `<div class="vitals">
    <div class="gauge" style="color:${color}"><svg viewBox="0 0 84 84">
      <circle class="gbg" cx="42" cy="42" r="34"/>
      <circle class="gfg" cx="42" cy="42" r="34" stroke-dasharray="${C}" stroke-dashoffset="${(C * (1 - score / 100)).toFixed(1)}"/></svg>
      <div class="gscore">${score}<span>分</span></div></div>
    <div class="vmeta"><div class="vgrade" style="color:${color}">${grade}</div>
      <div class="vadvice">${advice}</div>
      <div class="vstats">${stat("死代码", h.dead ?? 0, "死代码", h.suspects ? `<em> +${h.suspects} 疑似</em>` : "")}${stat("死导出", h.deadExports ?? 0, "死代码")}${stat("循环依赖", h.cycles ?? 0, "循环依赖")}${stat("断点", h.breaks ?? 0, "断点")}</div>
    </div></div>`;
}
function wikiPanel() {
  return kicker("book", "WIKI") + `<h2>${pageTitle(sel.page)}</h2>` +
    (pageBody(sel.page) || `<p class="dimtext">页面不存在：${esc(sel.page)}</p>`);
}

/* 体检：独立模态——它不属于某个节点，没有「介绍/关系」语义，不占侧边面板 */
const healthDlg = document.getElementById("healthDlg"), healthBody = document.getElementById("healthBody");
function scrollToSection(root, name) {
  if (!name) { root.scrollTop = 0; return; }
  const h = [...root.querySelectorAll("[data-h]")].find(e => e.dataset.h === name);
  if (h) h.scrollIntoView({ block: "start" });
}
function openHealth(anchor) {
  healthBody.innerHTML = `<button class="hclose" title="关闭">${ic("x")}</button>` +
    kicker("shield", "体检", "var(--warn)") + `<h2>${pageTitle("health.md")}</h2>` +
    vitalsCard() + mdRender(WIKI["health.md"] || "");
  if (!healthDlg.open) healthDlg.showModal();
  healthBody.querySelector(".hclose").onclick = () => healthDlg.close();
  healthBody.querySelectorAll("[data-hsec]").forEach(el =>
    el.addEventListener("click", () => scrollToSection(healthBody, el.dataset.hsec)));
  const gfg = healthBody.querySelector(".gauge .gfg");
  if (gfg && motionOK) {   // 入场：从 0 长到得分
    const off = gfg.getAttribute("stroke-dashoffset");
    gfg.setAttribute("stroke-dashoffset", gfg.getAttribute("stroke-dasharray"));
    requestAnimationFrame(() => requestAnimationFrame(() => gfg.setAttribute("stroke-dashoffset", off)));
  }
  requestAnimationFrame(() => scrollToSection(healthBody, anchor));
}
healthDlg.addEventListener("click", e => { if (e.target === healthDlg) healthDlg.close(); });
document.getElementById("btnHealth")?.addEventListener("click", () => openHealth());
function scenarioPanel(fi) {
  const F = FLOWS[fi];
  const head = kicker("play", "场景") + `<h2>${F.title}</h2>`;
  const steps = `<ul class="steps">${F.steps.map((s, j) =>
    `<li data-step="${j}">${j + 1}. ${s.title}</li>`).join("")}</ul>`;
  if (tab === "page") {
    const body = pageBody(F.page || "data-flow.md");
    return head + (body || `<h3>步骤（可点击播放）</h3>` + steps);
  }
  const route = [...new Set(F.steps.flatMap(s => [s.from, s.to]))];
  return head +
    `<h3>入口</h3>` + chips([nodeChip(F.steps[0].from)]) +
    `<h3>途经模块</h3>` + chips(route.map(c => nodeChip(c))) +
    `<h3>步骤（可点击播放）</h3>` + steps;
}
function linkPanel(i) {
  const l = DATA.links[i];
  return kicker("gateway", "结构关系") + `<h2>${l.label}</h2>
    <p>${l.what || ""}</p><p><code>${N[l.from].name}</code> → <code>${N[l.to].name}</code></p>
    ${srcList([...(N[l.from].sources || []).slice(0, 1), ...(N[l.to].sources || []).slice(0, 1)])}`;
}
function flowPanel(i) {
  const F = FLOWS[activeFlow], f = F.steps[i];
  const list = F.steps.map((s, j) =>
    `<li class="${j < i ? "done" : j === i ? "now" : ""}" data-step="${j}">${j + 1}. ${s.title}</li>`).join("");
  return kicker("play", F.title) + `<h2>第 ${i + 1}/${F.steps.length} 步 · ${f.title}</h2>
    <p>${f.what}</p><p><code>${N[f.from].name}</code> → <code>${N[f.to].name}</code></p>
    ${srcList(f.sources || [...(N[f.from].sources || []).slice(0, 1), ...(N[f.to].sources || []).slice(0, 1)])}
    <h3>全部步骤（可点击）</h3><ul class="steps">${list}</ul>`;
}
function scrollToAnchor(pageRef) {
  const anchor = pageRef?.split("#")[1];
  if (!anchor) { panel.scrollTop = 0; return; }
  const h = [...panel.querySelectorAll("[data-h]")].find(e => e.dataset.h === anchor);
  if (h) h.scrollIntoView({ block: "start" });
}
function render() {
  panel.innerHTML =
    sel == null ? systemPanel() :
    typeof sel === "number" ? flowPanel(sel) :
    typeof sel === "object" ? (sel.flow != null ? scenarioPanel(sel.flow) : wikiPanel()) :
    sel.startsWith("L") ? linkPanel(+sel.slice(1)) : nodePanel(sel);
  document.querySelectorAll("nav .item").forEach(e => {
    e.classList.toggle("sel", e.dataset.code === sel);
    e.classList.remove("dm");
  });
  panel.querySelectorAll(".steps li").forEach(li =>
    li.addEventListener("click", () => { pauseAuto(); showStep(+li.dataset.step); }));
  panel.querySelectorAll("li.src").forEach(li =>
    li.addEventListener("click", async () => {
      try { await navigator.clipboard.writeText(li.dataset.path); } catch {}
      const c = li.querySelector("code"), t = c.textContent;
      c.textContent = "已复制 ✓"; setTimeout(() => c.textContent = t, 900);
    }));
  panel.querySelectorAll(".chip[data-code]").forEach(ch =>
    ch.addEventListener("click", () => select(ch.dataset.code)));
  panel.querySelectorAll(".chip[data-flow]").forEach(ch =>
    ch.addEventListener("click", () => showScenarioStep(+ch.dataset.flow, +ch.dataset.step)));
  panel.querySelectorAll("[data-hsec]").forEach(ch =>
    ch.addEventListener("click", () => openHealth(ch.dataset.hsec)));
  panel.querySelectorAll("a.wl").forEach(a =>
    a.addEventListener("click", () => {
      const cur = (sel && typeof sel === "object" && (sel.page || FLOWS[sel.flow]?.page)) ||
        (typeof sel === "string" && !sel.startsWith("L") && N[sel]?.page) || "index.md";
      const target = resolvePage(cur.split("#")[0], a.dataset.href);
      openWikiPage(target, a.dataset.href.split("#")[1]);
    }));
  if (typeof sel === "object" && sel) scrollToAnchor(sel.flow != null ? FLOWS[sel.flow].page : sel.page);
  else if (typeof sel === "string" && !sel.startsWith("L") && tab === "page") scrollToAnchor(N[sel]?.page);
}
tabPage.onclick = () => { tab = "page"; tabPage.classList.add("on"); tabRel.classList.remove("on"); render(); };
tabRel.onclick = () => { tab = "rel"; tabRel.classList.add("on"); tabPage.classList.remove("on"); render(); };

/* ── 聚焦 ── */
function focusSet(set) {
  for (const [c, g] of Object.entries(nodeEls)) g.classList.toggle("dim", !!set && !set.has(c));
  for (const g of gPlate.children) g.classList.toggle("dim", !!set && !set.has(g.dataset.code));
  for (const g of gTag.children) {   // 分区名牌跟随聚焦：区内无亮节点则一同退下
    if (!g.dataset.d) continue;
    g.classList.toggle("dim", !!set && !DATA.nodes.some(n => n.district === g.dataset.d && set.has(n.code)));
  }
  for (const g of [...gLink.children, ...gFlow.children]) {
    const [a, b] = g.dataset.n.split(" ");
    g.classList.toggle("dim", !!set && !(set.has(a) && set.has(b)));
  }
}
const hood = code => new Set([code, ...(adj[code] || [])]);
function markSel(code) {
  gSel.innerHTML = "";
  if (!code) return;
  const n = N[code];
  el("polygon", { id: "selring", points: P([
    iso(n.x - .35, n.y - .35), iso(n.x + n.w + .35, n.y - .35),
    iso(n.x + n.w + .35, n.y + n.d + .35), iso(n.x - .35, n.y + n.d + .35)]),
    fill: "none", stroke: "var(--accent)", "stroke-width": 2 }, gSel);
}
function hopNode(code) {
  const g = nodeEls[code];
  if (!g) return;
  g.classList.remove("hop"); g.getBBox(); g.classList.add("hop");
  g.addEventListener("animationend", () => g.classList.remove("hop"), { once: true });
}
function baseFocus() {
  if (typeof sel === "string" && !sel.startsWith("L")) return hood(sel);
  if (sel && typeof sel === "object" && sel.flow != null)
    return new Set(FLOWS[sel.flow].steps.flatMap(s => [s.from, s.to]));
  return null;
}
function select(code) {
  stopFlowVisual(); sel = code;
  if (code == null && activeFlow >= 0) { activeFlow = -1; syncFlowbar(); }  // 点空白回总览
  const isNode = typeof code === "string" && !code.startsWith("L");
  buildEdges();
  markSel(isNode ? code : null);
  focusSet(isNode ? hood(code) : null);
  if (isNode) hopNode(code);
  render();
}
/* 打开 wiki 页时同步地图：模块页→点亮对应楼；场景小节→激活对应路线；跨模块页→不选中。
   面板收起时先展开——内容不能渲染进看不见的地方 */
function openWikiPage(target, anchor) {
  if (target === "health.md") { openHealth(anchor); return; }
  if (document.body.classList.contains("aside-off")) document.getElementById("handleAside").click();
  const ref = target + (anchor ? "#" + anchor : "");
  const fi = FLOWS.findIndex(f => f.page && f.page.split("#")[0] === target &&
    anchor && f.page.split("#")[1] === anchor);
  if (fi >= 0) {
    stopFlowVisual(); activeFlow = fi; syncFlowbar();
    sel = { flow: fi }; markSel(null); buildEdges(stepsOf(fi));
    focusSet(new Set(FLOWS[fi].steps.flatMap(s => [s.from, s.to])));
    render(); return;
  }
  const matches = DATA.nodes.filter(n => (n.page || "").split("#")[0] === target);
  if (matches.length === 1) {
    select(matches[0].code);
    if (anchor) scrollToAnchor(ref);
    return;
  }
  sel = { page: ref }; markSel(null); render();
  let set = null;
  if (matches.length) set = new Set(matches.map(n => n.code));
  else {
    const fs = FLOWS.filter(f => (f.page || "").split("#")[0] === target);
    if (fs.length) set = new Set(fs.flatMap(f => f.steps.flatMap(s => [s.from, s.to])));
  }
  focusSet(set); navDim(set);
}
function navDim(set) {
  document.querySelectorAll("nav .item").forEach(e =>
    e.classList.toggle("dm", !!set && !set.has(e.dataset.code)));
}
function bindNode(g) {
  const code = g.dataset.code;
  g.addEventListener("mouseenter", () => {
    if (typeof sel !== "number") {
      focusSet(hood(code)); buildEdges(stepsFor(code));
      if (sel == null) panel.innerHTML = nodePanel(code);
    }
  });
  g.addEventListener("mouseleave", () => {
    if (typeof sel !== "number") {
      focusSet(baseFocus()); buildEdges();
      if (sel == null) render();
    }
  });
  g.addEventListener("click", e => { e.stopPropagation(); select(code); });
}
Object.values(nodeEls).forEach(bindNode);
[...gPlate.children].forEach(bindNode);

/* ── 流程追踪 ── */
let auto = null, stepIdx = -1;
function showStep(i) {
  stepIdx = i; sel = i; markSel(null); render();
  flowEls.forEach(({ p, glow }, j) => {
    p.setAttribute("stroke", j === i ? "var(--accent)" : "var(--ink)");
    p.setAttribute("stroke-width", j === i ? 2.6 : j < i ? 2 : 1.6);
    p.setAttribute("marker-end", j === i ? "url(#arrA)" : "url(#arr)");
    p.setAttribute("opacity", j <= i ? 1 : .35);
    glow.setAttribute("opacity", j === i ? .22 : 0);
  });
  const f = FLOWS[activeFlow].steps[i];
  focusSet(new Set([f.from, f.to]));
  hopNode(f.to);
  gStreak.style.display = "none";
  if (playPulse) playPulse.remove();
  const p = flowEls[i].p, len = p.getTotalLength(), t0 = performance.now(), dur = motionOK ? 340 : 0;
  playPulse = el("path", { d: p.getAttribute("d"), stroke: "#FFFFFF", "stroke-width": 3,
    fill: "none", "stroke-linecap": "round", opacity: .95,
    "stroke-dasharray": `22 ${(len + 22).toFixed(1)}`, "stroke-dashoffset": 22 }, gTag);
  (function anim(now) {
    const k = dur ? Math.min((now - t0) / dur, 1) : 1;
    playPulse.setAttribute("stroke-dashoffset", (22 - k * (len + 22)).toFixed(1));
    if (k < 1 && stepIdx === i) requestAnimationFrame(anim);
  })(t0);
}
function pauseAuto() { if (auto) clearTimeout(auto); auto = null; }
function stopFlowVisual() {
  pauseAuto(); stepIdx = -1;
  if (playPulse) { playPulse.remove(); playPulse = null; }
  gStreak.style.display = "";
  flowEls.forEach(({ p, glow }) => { p.setAttribute("stroke", "var(--ink)");
    p.setAttribute("stroke-width", 1.6); p.setAttribute("marker-end", "url(#arr)");
    p.setAttribute("opacity", 1); glow.setAttribute("opacity", 0); });
}
document.getElementById("btnPlay").onclick = () => {
  if (activeFlow < 0) { activeFlow = 0; syncFlowbar(); }
  stopFlowVisual(); buildEdges(stepsOf(activeFlow)); showStep(0);
  const steps = FLOWS[activeFlow]?.steps || [];
  const tick = () => {
    if (stepIdx + 1 >= steps.length) { auto = null; return; }
    showStep(stepIdx + 1);
    auto = setTimeout(tick, motionOK ? 620 : 400);
  };
  auto = setTimeout(tick, motionOK ? 620 : 400);
};
document.getElementById("btnStep").onclick = () => {
  if (activeFlow < 0) { activeFlow = 0; syncFlowbar(); buildEdges(stepsOf(0)); }
  pauseAuto(); showStep((stepIdx + 1) % (FLOWS[activeFlow]?.steps.length || 1));
};

/* ── 取景 / 平移缩放 / 响应式 ── */
const stage = document.getElementById("stage");
function fitHome() {
  const boxes = [gDist.getBBox(), gNode.getBBox(), gPlate.getBBox(), gTag.getBBox()];
  const x = Math.min(...boxes.map(b => b.x)) - 18, y = Math.min(...boxes.map(b => b.y)) - 16;
  return { x, y,
    w: Math.max(...boxes.map(b => b.x + b.width)) + 18 - x,
    h: Math.max(...boxes.map(b => b.y + b.height)) + 16 - y };
}
const HOME = fitHome();
let vb = { ...HOME }, homeView = true;
const applyVB = () => svg.setAttribute("viewBox", `${vb.x} ${vb.y} ${vb.w} ${vb.h}`);
document.getElementById("btnReset").onclick = () => { stopFlowVisual(); select(null); vb = { ...HOME }; homeView = true; applyVB(); };
new ResizeObserver(() => { if (homeView) applyVB(); }).observe(stage);
let pan = null, moved = false, pinch = null;
const touches = new Map();
stage.addEventListener("pointerdown", e => {
  if (e.target.closest(".b") || e.target.closest(".lk") || e.target.closest("#flowbar")) return;
  touches.set(e.pointerId, [e.clientX, e.clientY]);
  stage.setPointerCapture(e.pointerId);
  if (touches.size === 2) {   // 双指捿合：以按下时取景为基准缩放
    const [a, b] = [...touches.values()];
    pinch = { d: Math.hypot(a[0] - b[0], a[1] - b[1]) || 1, vb: { ...vb } };
    pan = null; moved = true;
    stage.classList.remove("panning");
    return;
  }
  pan = { px: e.clientX, py: e.clientY, x: vb.x, y: vb.y }; moved = false;
  stage.classList.add("panning");
});
stage.addEventListener("pointermove", e => {
  if (touches.has(e.pointerId)) touches.set(e.pointerId, [e.clientX, e.clientY]);
  if (pinch && touches.size >= 2) {
    const [a, b] = [...touches.values()];
    const k = pinch.d / (Math.hypot(a[0] - b[0], a[1] - b[1]) || 1);
    const r = svg.getBoundingClientRect();
    const mx = pinch.vb.x + ((a[0] + b[0]) / 2 - r.left) / r.width * pinch.vb.w;
    const my = pinch.vb.y + ((a[1] + b[1]) / 2 - r.top) / r.height * pinch.vb.h;
    vb = { x: mx - (mx - pinch.vb.x) * k, y: my - (my - pinch.vb.y) * k, w: pinch.vb.w * k, h: pinch.vb.h * k };
    homeView = false; applyVB();
    return;
  }
  if (!pan) return;
  if (Math.hypot(e.clientX - pan.px, e.clientY - pan.py) > 3) moved = true;
  const k = vb.w / stage.clientWidth;
  vb.x = pan.x - (e.clientX - pan.px) * k; vb.y = pan.y - (e.clientY - pan.py) * k;
  if (moved) { homeView = false; applyVB(); }
});
const endPointer = e => {
  touches.delete(e.pointerId);
  if (touches.size < 2) pinch = null;
};
stage.addEventListener("pointercancel", endPointer);
stage.addEventListener("pointerup", e => {
  endPointer(e);
  const wasPan = pan; pan = null; stage.classList.remove("panning");
  if (wasPan && !moved && !e.target.closest(".b") && !e.target.closest(".lk") && !e.target.closest("#flowbar")) select(null);
});
stage.addEventListener("wheel", e => {
  e.preventDefault();
  const k = e.deltaY > 0 ? 1.12 : 1 / 1.12;
  const r = svg.getBoundingClientRect();
  const mx = vb.x + (e.clientX - r.left) / r.width * vb.w;
  const my = vb.y + (e.clientY - r.top) / r.height * vb.h;
  vb = { x: mx - (mx - vb.x) * k, y: my - (my - vb.y) * k, w: vb.w * k, h: vb.h * k };
  homeView = false; applyVB();
}, { passive: false });

applyVB();
render();
</script>
</body>
